name: Copy product photos into the site
on:
  push:
    paths: ['products.json', 'tools/fetch_images.py', '.github/workflows/fetch-images.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python tools/fetch_images.py
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add img/p products.json tools/fetch_failed.txt
          git diff --cached --quiet || git commit -m "Copy product photos into the site [skip ci]"
          git push
