name: Find furniture pieces in set photos
on:
  workflow_dispatch:
  push:
    paths: ['tools/detect_list.json', 'tools/detect.py']
permissions: { contents: write }
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision && pip install transformers pillow scipy
      - run: python tools/detect.py
      - name: Commit boxes
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add tools/boxes.json; git commit -m "Detected furniture boxes [skip ci]" || exit 0
          git pull --rebase; git push
